<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0e0e0e;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }

        .container {
            max-width: 600px;
            text-align: left;
        }

        .section {
            margin-bottom: 40px;
        }

        .meta {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
            display: block;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
            color: #ccc;
            font-size: 16px;
        }

        li::before {
            content: "•";
            color: #fff;
            margin-right: 10px;
        }

        .back-container {
            margin-top: 40px;
            text-align: center;
        }

        a {
            font-size: 20px;
            text-decoration: none;
            color: #fff;
            transition: 0.2s;
            text-underline-offset: 7px;
        }

        a:hover {
            text-decoration: underline;
            text-decoration-thickness: 2px;
        }
    </style>
</head>
<body>

<main>
    <h1>Changelogs</h1>
    <p class="subtitle">Latest updates for Slurp Client</p>

    <div class="container">
        <div class="section">
            <span class="meta">Feb. 12, 2026</span>
            <ul>
                <li>Client release</li>
            </ul>
        </div>
    </div>

    <div class="back-container">
        <a href="index.html">Back to Home</a>
    </div>
</main>

</body>
</html>
