<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Client</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #ffffff;
      --bg: #0a0a0a;
      --surface: rgba(18, 18, 18, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6e6e6;
      --muted: #9a9a9a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #141414, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .hero {
      max-width: 800px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .brand-text {
      font-size: clamp(48px, 10vw, 80px);
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -3px;
    }

    .hero p {
      margin: 0 auto 32px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 480px;
    }

    .cta-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .footer-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: var(--surface);
      position: sticky;
      bottom: 0;
    }

    .credits {
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .footer-container {
        flex-direction: column;
        gap: 8px;
        padding: 16px 20px;
        text-align: center;
      }
      
      .brand-text {
        font-size: 48px;
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1 class="brand-text">Apple Client</h1>
    <p>Apple is a client that meets all your needs, both visually and functionally.</p>
    
    <div class="cta-group">
      <a href="https://extra.mysellauth.com/product/apple-client" target="_blank" class="btn btn-primary">Purchase</a>
      <a href="https://discord.gg/5eX3cRNP" target="_blank" class="btn btn-secondary">Discord</a>
    </div>
  </section>

  <div class="footer-container">
    <div>&copy; 2026 Apple Client. All rights reserved.</div>
    <div class="credits">Developed by X / Alex & Ethan</div>
  </div>

</body>
</html>
