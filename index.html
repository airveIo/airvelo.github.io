<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Client</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #03c0fcff;
      --bg: #0a0a0a;
      --surface: rgba(18, 18, 18, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6e6e6;
      --muted: #9a9a9a;
      --separator: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at top, #141414, var(--bg));
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0px;
    }

    .page-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    #maintenance {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: var(--surface);
      padding: 50px 40px;
      border-radius: 16px;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.45s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(77, 163, 255, 0.1);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid rgba(77, 163, 255, 0.2);
      margin-bottom: 25px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), #03c0fcff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 0;
    }

    .footer-container {
      width: 100%;
      text-align: center;
      padding: 15px 0;
      border-top: 1px solid var(--separator);
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      #maintenance {
        padding: 30px 20px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page-container">
    <div id="maintenance" role="alert" aria-live="polite">
      <div class="status-badge">
        <span class="status-dot" aria-hidden="true"></span>
        System Maintenance
      </div>

      <h1>We'll be right back</h1>

      <p>
        The servers are currently undergoing maintenance to improve performance and reliability.
        We apologize for any inconvenience and will be back online shortly.
      </p>
    </div>
  </div>

  <div class="footer-container">
    &copy; 2026 Apple Client. All rights reserved.
  </div>
</body>


</html>
