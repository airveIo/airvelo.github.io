<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Info</title>

<style>
body{
  background:#0b0b0b;
  color:#00ff9c;
  font-family:monospace;
  padding:30px;
}

h1{
  font-size:42px;
  margin-bottom:20px;
}

#terminal{
  background:#111;
  padding:20px;
  border-radius:8px;
}

.line{
  color:#fff;
  margin:4px 0;
}

.label{
  color:#00ff9c;
}
</style>
</head>

<body>

<h1>Hello friend 👋</h1>

<div id="terminal"></div>

<script>

const term = document.getElementById("terminal");

function line(label,value){
  const div=document.createElement("div");
  div.className="line";
  div.innerHTML="<span class='label'>"+label+":</span> "+value;
  term.appendChild(div);
}

/* Basic browser info */
line("User Agent", navigator.userAgent);
line("Platform", navigator.platform);
line("Language", navigator.language);
line("Languages", navigator.languages.join(", "));
line("Cookies Enabled", navigator.cookieEnabled);
line("Online", navigator.onLine);
line("Do Not Track", navigator.doNotTrack);

/* Screen info */
line("Screen Resolution", screen.width+" x "+screen.height);
line("Available Screen", screen.availWidth+" x "+screen.availHeight);
line("Color Depth", screen.colorDepth);

/* Hardware info */
line("CPU Cores", navigator.hardwareConcurrency || "Unknown");
line("Device Memory (GB)", navigator.deviceMemory || "Unknown");
line("Max Touch Points", navigator.maxTouchPoints);

/* Time */
line("Timezone", Intl.DateTimeFormat().resolvedOptions().timeZone);

/* Network */
if(navigator.connection){
line("Network Type", navigator.connection.effectiveType);
line("Downlink", navigator.connection.downlink+" Mbps");
}

/* Battery */
if(navigator.getBattery){
navigator.getBattery().then(b=>{
  line("Battery Level", Math.round(b.level*100)+"%");
  line("Charging", b.charging);
});
}

/* Location (permission required) */
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
  line("Latitude", pos.coords.latitude);
  line("Longitude", pos.coords.longitude);
},()=>{
  line("Location","Permission denied");
});
}

/* IP + location */
fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{
  line("IP", d.ip);
  line("City", d.city);
  line("Region", d.region);
  line("Country", d.country_name);
  line("ISP", d.org);
});

</script>

</body>
</html>
