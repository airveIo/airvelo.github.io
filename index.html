<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slurp | Changelog</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #1a1d21;
            --panel: #24292e;
            --panel-border: #30363d;
            --input-bg: #0d1117;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --warning-bg: #3b3215;
            --warning-border: #6a571c;
            --warning-text: #ffda6a;
            --disabled-bg: #484f58;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 40px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            margin: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            color: var(--text-main);
        }

        .description {
            display: block;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }

        .separator {
            height: 1px;
            background-color: var(--panel-border);
            margin-bottom: 24px;
            border: none;
            width: 100%;
        }

        .log-date {
            display: inline-block;
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }

        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .log-list li {
            font-size: 14px;
            color: var(--text-muted);
            padding: 10px 0;
            padding-left: 20px;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            line-height: 1.4;
        }

        .log-list li:last-child { border: none; }

        .log-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--text-main);
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="main-container">
        <h2>Changelog</h2>
        <span class="description">Latest updates for Slurp</span>
        
        <div class="separator"></div>

        <div class="log-date">02/06/2026</div>
        
        <ul class="log-list">
            <li>Added inventory move</li>
            <li>Added anti fireball</li>
            <li>Added tick base</li>
            <li>Added no rotate</li>
            <li>Added auto pot</li>
            <li>Fixed crashes when switching resource packs</li>
        </ul>
    </div>

    <script>
        lucide.createIcons();
        
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toUpperCase() === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });

        (function () {
            const devtools = /./;
            devtools.toString = function () {
                window.location.reload();
            };
            setInterval(() => {
                const start = performance.now();
                try { debugger; } catch {}
                const end = performance.now();
                if (end - start > 100) {
                    window.location.reload();
                }
                console.clear();
            }, 500);
        })();
    </script>
</body>
</html>
