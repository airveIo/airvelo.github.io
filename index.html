<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slurp | Feed</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --border: #27272a;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        #feed {
            width: 100%;
            max-width: 600px;
        }

        .post {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .post h2 { 
            margin: 0 0 16px; 
            font-size: 1.75rem; 
            font-weight: 700;
            color: #ffffff;
        }

        .post p { 
            color: var(--text-dim); 
            font-size: 1.1rem;
            margin: 0; 
            white-space: pre-wrap; 
        }

        .post a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 600;
        }

        .meta {
            font-size: 0.85rem;
            color: #52525b;
            margin-top: 32px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLURP</h1>
        <p class="subtitle">Updates and Announcements</p>
    </header>

    <main id="feed">
        <div id="loading-state" style="text-align: center; color: var(--text-dim);">Loading...</div>
    </main>

    <script>
        function linkify(text) {
            const urlPattern = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        async function loadFeed() {
            const feedContainer = document.getElementById('feed');
            try {
                const response = await fetch('news.html');
                if (!response.ok) throw new Error();
                
                const rawText = await response.text();
                let postData;

                try {
                    const parsed = JSON.parse(rawText);
                    postData = Array.isArray(parsed) ? parsed[0] : parsed;
                } catch (e) {
                    postData = {
                        title: "Latest Update",
                        content: rawText,
                        date: "Feb. 15, 2026"
                    };
                }

                feedContainer.innerHTML = `
                    <article class="post">
                        <h2>${postData.title || "Update"}</h2>
                        <p>${linkify(postData.content || rawText)}</p>
                        <div class="meta">${postData.date || "Feb. 15, 2026"}</div>
                    </article>
                `;

            } catch (err) {
                feedContainer.innerHTML = `<div style="text-align: center; color: #ff4444;">Check back later for updates</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
