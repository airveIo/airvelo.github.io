<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Client</title>
<style>
:root {
  --accent: #03c0fcff;
  --bg: #0a0a0a;
  --surface: rgba(18, 18, 18, 0.85);
  --border: rgba(255, 255, 255, 0.08);
  --text: #e6e6e6;
  --muted: #9a9a9a;
  --separator: rgba(255,255,255,0.08);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,sans-serif;}
html, body {height:100%;background:radial-gradient(circle at top, #141414, var(--bg));color:var(--text);}
body {display:flex;flex-direction:column;text-align:center;overflow:hidden;}

.page-wrapper {flex:1;display:flex;justify-content:center;align-items:center;width:100%;padding:20px;}

.maintenance-container {
  max-width:600px;
  width:100%;
  background:var(--surface);
  padding:50px 40px;
  border-radius:16px;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp 0.6s forwards;
}

.status-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(3,192,252,0.1);
  color:var(--accent);
  padding:8px 16px;
  border-radius:20px;
  font-size:0.9rem;
  font-weight:600;
  border:1px solid rgba(3,192,252,0.2);
  margin-bottom:30px;
  opacity:0;
  animation:fadeIn 0.6s 0.2s forwards;
}
.status-dot {
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  box-shadow:0 0 10px var(--accent);
}

h1 {
  font-size:2.5rem;
  margin-bottom:15px;
  background:linear-gradient(135deg,var(--accent),#03c0fcff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:800;
  opacity:0;
  animation:fadeIn 0.6s 0.4s forwards;
}

p {
  font-size:1.1rem;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:30px;
  opacity:0;
  animation:fadeIn 0.6s 0.6s forwards;
}

.footer-container {
  width:100%;
  text-align:center;
  padding:15px 0;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:0.8rem;
  opacity:0;
  animation:fadeIn 0.6s 0.8s forwards;
  background:var(--surface);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  position:sticky;
  bottom:0;
}

@keyframes fadeUp { to {opacity:1;transform:translateY(0);} }
@keyframes fadeIn { to {opacity:1;} }

@media (max-width:600px){
  .maintenance-container{padding:30px 20px;}
  h1{font-size:2rem;}
}
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="maintenance-container">
    <div class="status-badge">
      <span class="status-dot"></span>
      System Maintenance
    </div>

    <h1>We'll be right back</h1>

    <p>
      Our servers are temporarily offline for scheduled maintenance. We're improving performance and reliability behind the scenes. Thank you for your patience services will be restored shortly.
    </p>
  </div>
</div>

<div class="footer-container">&copy; 2026 Apple Client. All rights reserved.</div>
</body>
</html>
