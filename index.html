<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slurp</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0d1117;
            --panel: rgba(22, 27, 34, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(13, 17, 23, 0.7);
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --warning-bg: rgba(59, 50, 21, 0.6);
            --warning-border: #6a571c;
            --warning-text: #ffda6a;
            --disabled-bg: #21262d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(48, 54, 61, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(31, 35, 40, 0.4) 0px, transparent 50%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .maintenance-notice {
            margin-bottom: 28px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.45;
            text-align: center;
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.2px;
        }

        .description {
            display: block;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }

        .separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--panel-border), transparent);
            margin-bottom: 28px;
            border: none;
            width: 100%;
        }

        .form-row {
            margin-bottom: 22px;
        }

        .label-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: normal;
            letter-spacing: 0.5px;
        }

        .label-icon {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-size: 14px;
            opacity: 0.6;
            outline: none;
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 8px;
            background-color: var(--disabled-bg);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: not-allowed;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="login-container">
        <div class="maintenance-notice">
            Access is currently unavailable.
        </div>
        <h2>Login</h2>
        <span class="description">Access your Slurp account</span>
        <div class="separator"></div>
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="user" class="label-icon"></i>
                <label>Username</label>
            </div>
            <input type="text" disabled value="Enter your username">
        </div>
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="lock" class="label-icon"></i>
                <label>Password</label>
            </div>
            <input type="password" disabled value="••••••••">
        </div>
        <button disabled>Login</button>
    </div>
    <script>
        lucide.createIcons();
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toUpperCase() === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });
        (function () {
            const devtools = /./;
            devtools.toString = function () {
                window.location.reload();
            };
            setInterval(() => {
                const start = performance.now();
                try { debugger; } catch {}
                const end = performance.now();
                if (end - start > 100) {
                    window.location.reload();
                }
                console.clear();
            }, 500);
        })();
    </script>
</body>
</html>
