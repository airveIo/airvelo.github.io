<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slurp | Media Share</title>
    
    <meta property="og:type" content="video.other">
    <meta property="og:site_name" content="Slurp">
    <meta property="og:title" content="Slurp Media">
    <meta property="og:description" content="Watch this media on Slurp.">
    <meta property="og:image" content="https://slurpclient.com/preview.png">
    <meta property="og:video" content="https://slurpclient.com/preview.mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    <meta name="twitter:card" content="player">
    <meta name="twitter:player" content="https://slurpclient.com/preview.mp4">
    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">

    <style>
        :root { --discord-blurple: #5865F2; --bg-dark: #0f0f0f; }
        body { background: var(--bg-dark); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        /* Streamable Style Container */
        .container { width: 90%; max-width: 1000px; text-align: center; }
        .video-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        video, img { width: 100%; display: block; max-height: 80vh; }
        
        /* Header/UI Elements */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-weight: bold; font-size: 1.5rem; color: var(--discord-blurple); text-decoration: none; }
        .btn-upload { background: var(--discord-blurple); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; }
        
        /* Upload UI */
        #upload-section { background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid #333; display: none; }
        .url-box { background: #000; padding: 12px; border: 1px solid var(--discord-blurple); color: #0f0; margin-top: 20px; font-family: monospace; cursor: pointer; }
    </style>
</head>
<body onload="handleRouting()">

    <div class="container">
        <div class="header">
            <a href="/" class="logo">SLURP</a>
            <a href="#upload" onclick="location.reload()" class="btn-upload">Upload</a>
        </div>

        <div id="view-section" style="display:none;">
            <div class="video-wrapper" id="media-container">
                </div>
        </div>

        <div id="upload-section">
            <h2 style="margin-top:0">Upload Media</h2>
            <input type="file" id="file-picker" style="margin-bottom:20px">
            <br>
            <button class="btn-upload" style="width:100%" onclick="handleUpload()">Create Link</button>
            <div id="status" style="margin-top:10px; color:#aaa"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "duncq0kca"; 
        const UPLOAD_PRESET = "slurp.me";

        function handleRouting() {
            const hash = window.location.hash.replace('#', '');
            if (hash === 'upload') {
                document.getElementById('upload-section').style.display = 'block';
            } else if (hash.length === 16) {
                document.getElementById('view-section').style.display = 'block';
                loadMedia(hash);
            } else {
                window.location.replace("https://discord.gg/QCPzTp9e3m");
            }
        }

        async function handleUpload() {
            const file = document.getElementById('file-picker').files[0];
            const status = document.getElementById('status');
            if (!file) return;

            const id = generateID(16);
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('public_id', id);

            status.innerText = "Processing...";
            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                const vanity = window.location.origin + "/#" + id;
                document.getElementById('result').innerHTML = `<div class="url-box" onclick="navigator.clipboard.writeText('${vanity}'); alert('Copied!')">${vanity}</div>`;
                status.innerText = "Complete!";
            } catch (e) { status.innerText = "Upload Error"; }
        }

        function loadMedia(id) {
            const container = document.getElementById('media-container');
            const imgUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${id}`;
            const vidUrl = `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/${id}.mp4`;
            
            // Try image, fallback to video
            container.innerHTML = `<img src="${imgUrl}" onerror="this.onerror=null; this.parentElement.innerHTML='<video src=\'${vidUrl}\' controls autoplay loop></video>';">`;
        }

        function generateID(len) {
            const c = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let r = '';
            for (let i = 0; i < len; i++) r += c.charAt(Math.floor(Math.random() * c.length));
            return r;
        }
    </script>
</body>
</html>
