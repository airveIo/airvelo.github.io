<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: grid;
            place-items: center;
            height: 100vh;
            text-align: center;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0e0e0e;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        a {
            font-size: 20px;
            text-decoration: none;
            color: #fff;
            transition: 0.2s;
            text-underline-offset: 6.5px;
        }

        a:hover {
            text-decoration: underline;
            text-decoration-thickness: 2px;
        }
    </style>
</head>
<body>

<main>
    <h1>Slurp Client</h1>
    <p class="subtitle">The ultimate cheating experience.</p>

    <div class="links">
        <a href="https://slurpclient.com/discord" target="_blank">Download</a>
        <a href="changelogs.html">Changelogs</a>
        <a href="https://slurpclient.com/discord" target="_blank">Discord</a>
    </div>
</main>

</body>
</html>
