<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slurp — Maintenance</title>

    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            background: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .maintenance-container {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 44px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.45);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        p {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .footer {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.75;
        }
    </style>

    <script>
        document.addEventListener("contextmenu", e => e.preventDefault());

        document.addEventListener("keydown", e => {
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key)) ||
                (e.ctrlKey && e.key === "U")
            ) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</head>

<body>
    <div class="maintenance-container">
        <h1>We'll be back soon</h1>

        <p>
            Slurp is currently undergoing scheduled maintenance.<br>
            We're making improvements and will be online shortly.
        </p>

        <div class="divider"></div>

        <div class="footer">
            © Slurp Client • All rights reserved.
        </div>
    </div>
</body>
</html>
