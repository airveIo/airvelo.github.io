<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slurp</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, sans-serif;
}

body {
    background: #0a0c12;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.container {
    background: #1b1f2a;
    padding: 40px 30px;
    border-radius: 16px;
    width: 380px;
    text-align: center;
}

h1 {
    font-size: 24px;
    margin-bottom: 16px;
    color: #f0f0f0;
}

p.description {
    font-size: 15px;
    color: #b0b0b0;
    margin-bottom: 25px;
    line-height: 1.5;
}

a {
    text-decoration: none;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(90deg, #3b82f6, #2563eb);
    color: white;
    transition: all 0.3s ease;
}

button:hover {
    background: linear-gradient(90deg, #2563eb, #1e40af);
}

.divider {
    height: 1px;
    background: #2a2f3d;
    margin: 20px 0;
}

p.info {
    font-size: 14px;
    color: #888c95;
    margin: 4px 0;
}
</style>
</head>
<body>

<div class="container">
    <h1>Slurp Launcher</h1>
    <p class="description">Get the latest version of our launcher for easy updates and smooth performance. Compatible with Windows systems.</p>

    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <button>Download</button>
    </a>

    <div class="divider"></div>
    <p class="info">Version: 1.0.3</p>
    <p class="info">File Size: 42 MB</p>
</div>

</body>
</html>
