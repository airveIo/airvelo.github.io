<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0f1115;
      color: #e6e6eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h2 {
      font-size: 18px;
      margin-top: 32px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .beta {
      color: #b388ff;
    }

    .stable {
      color: #4ade80;
    }

    ul {
      padding-left: 18px;
      margin: 0;
    }

    li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: #1f2430;
      margin: 28px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="beta">02/05/26 - beta</h2>
    <ul>
      <li>added inventory move</li>
      <li>added anti fireball</li>
      <li>added tick base</li>
      <li>added no rotate</li>
      <li>added auto pot</li>
      <li>fixed crashing when switching resource packs</li>
    </ul>

    <div class="divider"></div>

    <h2 class="stable">02/02/26 - stable</h2>
    <ul>
      <li>added target strafe</li>
      <li>added safe walk</li>
      <li>fixed and improved some stuff</li>
    </ul>
  </div>
</body>
</html>
