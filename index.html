```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Alt Shop</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
margin:0;
}

header{
background:#020617;
padding:20px;
}

.product{
background:#1e293b;
padding:20px;
margin:40px auto;
width:250px;
border-radius:10px;
}

button{
padding:10px 20px;
background:#22c55e;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#16a34a;
}

.cart{
margin-top:20px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
}

.modal-content{
background:#1e293b;
padding:20px;
width:300px;
margin:120px auto;
border-radius:10px;
}

input,select{
width:100%;
padding:8px;
margin-top:8px;
margin-bottom:10px;
border-radius:5px;
border:none;
}
</style>

</head>

<body>

<header>
<h1>Minecraft Alt Shop</h1>
<p>Unbanned Minecraft Alts - $0.10 each</p>
</header>

<div class="product">
<h2>Unbanned Minecraft Alt</h2>
<p>Instant Delivery</p>
<p>Price: $0.10</p>
<button onclick="addToCart()">Add to Cart</button>
</div>

<div class="cart">
<h2>Cart</h2>
<p>Items: <span id="count">0</span></p>
<p>Total: $<span id="total">0.00</span></p>
<button onclick="openCheckout()">Checkout</button>
</div>

<div id="checkout" class="modal">
<div class="modal-content">

<h2>Checkout</h2>

<label>Email</label>
<input type="email" placeholder="email@example.com">

<label>Payment Method</label>
<select>
<option>Demo Payment</option>
<option>PayPal (demo)</option>
<option>Crypto (demo)</option>
</select>

<button onclick="completeOrder()">Complete Order</button>
<br><br>
<button onclick="closeCheckout()">Cancel</button>

</div>
</div>

<script>
let cart = 0;
let price = 0.10;

function addToCart(){
cart++;
document.getElementById("count").innerText = cart;
document.getElementById("total").innerText = (cart * price).toFixed(2);
}

function openCheckout(){
if(cart == 0){
alert("Your cart is empty!");
return;
}
document.getElementById("checkout").style.display="block";
}

function closeCheckout(){
document.getElementById("checkout").style.display="none";
}

function completeOrder(){
alert("Demo order complete!");
cart=0;
document.getElementById("count").innerText=0;
document.getElementById("total").innerText="0.00";
closeCheckout();
}
</script>

</body>
</html>
