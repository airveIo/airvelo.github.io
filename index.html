<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Slurp</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-warning: #d29922;
        }

        body {
            background-color: var(--bg-main); 
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .login-container {
            background: var(--bg-card); 
            padding: 48px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border-radius: 0px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            pointer-events: none; 
            transition: transform 0.3s ease;
        }

        .maintenance-notice {
            background-color: rgba(187, 128, 9, 0.1);
            border: 1px solid rgba(187, 128, 9, 0.4);
            color: var(--accent-warning);
            padding: 14px;
            font-size: 13px;
            margin-bottom: 32px;
            border-radius: 0px; 
            line-height: 1.5;
            text-align: center;
            letter-spacing: 0.02em;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 4px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            display: block;
            text-align: center;
        }

        .form-row {
            margin-bottom: 24px;
        }

        .label-wrapper {
            display: flex;
            align-items: center;
            gap: 10px; 
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .label-icon {
            width: 15px;
            height: 15px;
            opacity: 0.6;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            background-color: #090c10;
            color: var(--text-secondary);
            opacity: 0.6;
            text-align: left;
            border-radius: 0px; 
            font-size: 15px;
            transition: all 0.2s ease;
        }

        button {
            background-color: #21262d;
            color: #484f58;
            border: 1px solid var(--border-color);
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            width: 100%;
            margin-top: 12px;
            cursor: not-allowed;
            border-radius: 0px; 
            transition: all 0.2s ease;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="login-container">
        <div class="maintenance-notice">
            <strong style="display: block; margin-bottom: 4px;">System Maintenance</strong>
            We're fine-tuning the experience. We'll be back online shortly.
        </div>

        <h2>Login</h2>
        <span class="description">Access your Slurp account</span>
        
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="user" class="label-icon"></i>
                <label>Username</label>
            </div>
            <input type="text" placeholder="••••••••" disabled>
        </div>
        
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="lock" class="label-icon"></i>
                <label>Password</label>
            </div>
            <input type="password" placeholder="••••••••" disabled>
        </div>
        
        <button disabled>Log in</button>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')) {
                e.preventDefault();
                return false;
            }
        });

        (function() {
            setInterval(function() {
                const start = performance.now();
                debugger;
                const end = performance.now();
                if (end - start > 100) {
                    window.location.reload();
                }
                console.clear();
            }, 100);
        })();
    </script>
</body>
</html>
