<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&nbsp;</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1a1d21, #0d1117);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --warning-text: #ffda6a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 0;
            padding: 40px 0;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .maintenance-notice, h2, .description, .form-row, button {
            margin-left: 40px;
            margin-right: 40px;
        }

        .maintenance-notice {
            margin-bottom: 28px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.45;
            text-align: center;
            background-color: rgba(255, 218, 106, 0.05);
            color: var(--warning-text);
            border: 1px solid rgba(255, 218, 106, 0.1);
            border-radius: 0;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 26px;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.2px;
        }

        .description {
            display: block;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }

        .separator {
            height: 1px;
            background: var(--glass-border);
            margin-bottom: 28px;
            border: none;
            width: 100%;
        }

        .form-row {
            margin-bottom: 22px;
        }

        .label-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .label-icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 0;
            color: var(--text-main);
            font-size: 14px;
            opacity: 0.55;
            outline: none;
        }

        button {
            width: calc(100% - 80px);
            height: 48px;
            margin-top: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            border-radius: 0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: not-allowed;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="login-container">
        <div class="maintenance-notice">
            Access is currently unavailable.
        </div>
        <h2>Login</h2>
        <span class="description">Access your Slurp account</span>
        <div class="separator"></div>
        
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="user" class="label-icon"></i>
                <label>Username</label>
            </div>
            <input type="text" disabled value="Enter your username">
        </div>

        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="lock" class="label-icon"></i>
                <label>Password</label>
            </div>
            <input type="password" disabled value="••••••••">
        </div>
        
        <button disabled>Login</button>
    </div>

    <script>
        lucide.createIcons();
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toUpperCase() === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });
        (function () {
            const devtools = /./;
            devtools.toString = function () {
                window.location.reload();
            };
            setInterval(() => {
                const start = performance.now();
                try { debugger; } catch {}
                const end = performance.now();
                if (end - start > 100) {
                    window.location.reload();
                }
                console.clear();
            }, 500);
        })();
    </script>
</body>
</html>
