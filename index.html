<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #121212;
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
            --accent: #ffffff;
            --border: #121212;
            --font: 'Tahoma', sans-serif;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #121212;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 64px;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 12px;
        }

        #feed {
            width: 100%;
            max-width: 600px;
        }

        .post {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 32px;
            display: block;
            overflow: hidden;
        }

        .post h2 { 
            margin: 0 0 12px; 
            font-size: 1.5rem; 
            font-weight: 700;
        }

        .post p { 
            color: var(--text-dim); 
            font-size: 1.05rem;
            margin: 0; 
        }

        .post a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: var(--text-dim);
        }

        .post a:hover {
            color: var(--accent);
            text-decoration-color: var(--accent);
        }

        .post img, .post video {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-top: 20px;
            display: block;
            border: 1px solid var(--border);
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 28px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: none;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 100;
        }

        #backToTop:hover {
            background: var(--border);
        }

        .skeleton {
            background: var(--card-bg);
            border-radius: 20px;
            height: 160px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <header role="banner">
        <h1>SLURP</h1>
        <p class="subtitle">Updates and Announcements</p>
    </header>

    <main id="feed" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </main>

    <button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">UP</button>

    <script>
        async function loadFeed() {
            const feed = document.getElementById('feed');
            try {
                const response = await fetch('test.html');
                if (!response.ok) throw new Error();
                const content = await response.text();
                
                setTimeout(() => {
                    feed.innerHTML = content;
                    feed.querySelectorAll('.meta').forEach(meta => {
                        const ts = meta.getAttribute('data-timestamp');
                        if (ts) {
                            const [y, m, d] = ts.split('-').map(Number);
                            meta.textContent = new Date(y, m - 1, d).toLocaleDateString(undefined, {
                                month: 'short', day: 'numeric', year: 'numeric'
                            });
                        }
                    });
                }, 600);
            } catch (err) {
                feed.innerHTML = `<p style="text-align: center; color: var(--text-dim);">Unable to load updates.</p>`;
            }
        }

        window.onscroll = function() {
            const btn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };

        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
