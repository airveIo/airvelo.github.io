<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --border: #27272a;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        #feed {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .post {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .post h2 { margin: 0 0 12px; font-size: 1.5rem; }
        .post p { color: var(--text-dim); white-space: pre-wrap; margin: 0; }
        
        .post a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 600;
        }

        .meta {
            font-size: 0.8rem;
            color: #52525b;
            margin-top: 24px;
            text-transform: uppercase;
        }

        .error-msg {
            color: #ff4444;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLURP</h1>
        <p class="subtitle">Updates and Announcements</p>
    </header>

    <main id="feed">
        <div style="text-align: center; color: #333;">Loading feed content...</div>
    </main>

    <script>
        function linkify(text) {
            const urlPattern = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        async function loadFeed() {
            const feedContainer = document.getElementById('feed');
            try {
                const response = await fetch('news.html');
                
                if (!response.ok) {
                    throw new Error('news.html file not found');
                }

                const rawText = await response.text();
                
                try {
                    const posts = JSON.parse(rawText);
                    
                    if (!Array.isArray(posts)) {
                        throw new Error('Data is not a valid list');
                    }

                    feedContainer.innerHTML = posts.map(post => `
                        <article class="post">
                            <h2>${post.title}</h2>
                            <p>${linkify(post.content)}</p>
                            <div class="meta">${post.date}</div>
                        </article>
                    `).join('');

                } catch (parseError) {
                    throw new Error('Invalid JSON format in news.html');
                }

            } catch (err) {
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        Unable to load feed: ${err.message}<br>
                        <span style="color: #666; font-size: 0.8rem;">
                            Note: This script requires a local server or web host to work.
                        </span>
                    </div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
