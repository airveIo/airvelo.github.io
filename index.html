<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slurp Client</title>
    <script>
        function handleRouting() {
            if (window.location.hash === "#upload") {
                document.getElementById('upload-section').style.display = 'block';
            } else {
                window.location.replace("https://discord.gg/QCPzTp9e3m");
            }
        }
    </script>
    <style>
        body { background: #0b0b0b; color: #eee; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #upload-section { 
            display: none;
            background: #161616; padding: 30px; border-radius: 12px; 
            border: 1px solid #333; width: 350px; text-align: center; 
        }
        h2 { color: #7289da; text-transform: uppercase; font-size: 1rem; letter-spacing: 1px; margin-top: 0; }
        input[type="file"] { margin: 20px 0; font-size: 0.8rem; width: 100%; }
        button { background: #7289da; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #888; }
        .url-output { 
            margin-top: 15px; background: #000; padding: 10px; border-radius: 4px; 
            border: 1px solid #444; color: #0f0; font-family: monospace; 
            font-size: 0.75rem; cursor: pointer; word-break: break-all;
        }
    </style>
</head>
<body onload="handleRouting()">

    <div id="upload-section">
        <h2>Slurp Secret Uploader</h2>
        <input type="file" id="file-picker" accept="image/*,video/*">
        <button onclick="handleUpload()">Upload</button>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        const CLOUD_NAME = "duncq0kca"; 
        const UPLOAD_PRESET = "slurp";

        async function handleUpload() {
            const file = document.getElementById('file-picker').files[0];
            const status = document.getElementById('status');
            const result = document.getElementById('result');

            if (!file) return;
            status.innerText = "Uploading...";

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.secure_url) {
                    status.innerText = "Click to copy link:";
                    result.innerHTML = `<div class="url-output" onclick="copyToClipboard('${data.secure_url}')">${data.secure_url}</div>`;
                } else {
                    status.innerText = "Error";
                }
            } catch (err) {
                status.innerText = "Error";
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied");
            });
        }
    </script>
</body>
</html>
