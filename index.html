<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Download the Slurp Launcher for Windows.">
<meta name="theme-color" content="#0a0c12">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta property="og:title" content="Slurp Launcher">
<meta property="og:description" content="Download the Slurp Launcher.">
<meta property="og:type" content="website">

<title>Slurp</title>

<style>
:root{
--bg:#0a0c12;
--card:#1b1f2a;
--divider:#2a2f3d;
--text-main:#ffffff;
--text-muted:#b5b5b5;
--text-info:#8f95a3;
--button:#2563eb;
--button-hover:#1e40af;
}

*,
*::before,
*::after{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Tahoma,sans-serif;
}

html{
line-height:1.4;
-webkit-text-size-adjust:100%;
text-rendering:optimizeLegibility;
}

body{
background:var(--bg);
color:var(--text-main);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow-x:hidden;
}

main{
width:100%;
display:flex;
align-items:center;
justify-content:center;
}

.container{
background:var(--card);
padding:40px 32px;
border-radius:16px;
width:100%;
max-width:380px;
text-align:center;
contain:layout style paint;
}

h1{
font-size:24px;
line-height:1.2;
margin-bottom:14px;
}

.description{
font-size:15px;
line-height:1.5;
color:var(--text-muted);
margin-bottom:26px;
}

.download-button{
display:block;
width:100%;
padding:14px;
font-size:16px;
border-radius:10px;
background:var(--button);
color:#ffffff;
text-decoration:none;
cursor:pointer;
user-select:none;
touch-action:manipulation;
}

.download-button:hover{
background:var(--button-hover);
}

.download-button:focus-visible{
outline:2px solid #3b82f6;
outline-offset:2px;
}

.divider{
height:1px;
background:var(--divider);
margin:22px 0;
}

.info{
font-size:13px;
line-height:1.4;
color:var(--text-info);
margin-top:6px;
}

@media (prefers-reduced-motion:reduce){
*{
animation:none !important;
transition:none !important;
}
}

</style>

</head>

<body>

<main>

<section class="container">

<h1>Slurp Launcher</h1>

<p class="description">
Get the latest version of our launcher for easy updates and smooth performance. Compatible with Windows systems.
</p>

<a
class="download-button"
href="https://slurpclient.com/soon"
role="button"
aria-label="Download Slurp Launcher"
rel="noopener"
>
Download
</a>

<div class="divider"></div>

<p class="info">Version: 0</p>
<p class="info">File Size: 0 MB</p>

</section>

</main>

</body>
</html>
