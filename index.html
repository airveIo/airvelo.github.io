<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Client</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #ffffff;
      --bg: #0a0a0a;
      --surface: rgba(18, 18, 18, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6e6e6;
      --muted: #9a9a9a;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #141414, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 550;
    }

    p {
      margin: 0 0 24px;
      font-size: 13px;
      color: var(--muted);
    }

    #maintenance {
      max-width: 1500px;
      text-align: center;
      color: var(--muted);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .footer-container {
      width: 100%;
      text-align: center;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: #0a0a0a;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: sticky;
      bottom: 0;
    }
  </style>
</head>

<body>
  <div id="maintenance">
    <h1>We'll be right back</h1>
    <p>Our servers are currently undergoing scheduled maintenance to improve performance and system reliability. We apologize for the inconvenience and will be back online shortly.</p>
  </div>

  <div class="footer-container">&copy; 2026 Apple Client • All rights reserved.</div>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    const views = {
      maintenance: $("maintenance")
    };

    function showView(view) {
      if (!views[view]) return;
      Object.values(views).forEach(v => v.classList.add("hidden"));
      views[view].classList.remove("hidden");
    }
  </script>
</body>
</html>
