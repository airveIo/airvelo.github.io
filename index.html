<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --border: #27272a;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        #feed {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .post {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .post h2 { 
            margin: 0 0 12px; 
            font-size: 1.5rem; 
            font-weight: 600;
        }

        .post p { 
            color: var(--text-dim); 
            font-size: 1rem;
            margin: 0; 
            white-space: pre-wrap; 
        }

        .post a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 600;
        }

        .meta {
            font-size: 0.8rem;
            color: #52525b;
            margin-top: 24px;
            font-weight: 500;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLURP</h1>
        <p class="subtitle">Updates and Announcements</p>
    </header>

    <main id="feed">
        <article class="post">
            <h2 id="post-title">Loading</h2>
            <p id="post-content">Please wait while the update is fetched</p>
            <div class="meta" id="post-meta">Pending</div>
        </article>
    </main>

    <script>
        function linkify(text) {
            const urlPattern = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        async function loadFeed() {
            try {
                const response = await fetch('news.html');
                if (!response.ok) throw new Error();
                
                const rawText = await response.text();
                
                let data;
                try {
                    const parsed = JSON.parse(rawText);
                    data = Array.isArray(parsed) ? parsed[0] : parsed;
                } catch (e) {
                    data = {
                        title: "Update",
                        content: rawText,
                        date: "Feb. 15, 2026"
                    };
                }

                document.getElementById('post-title').textContent = data.title || "Update";
                document.getElementById('post-content').innerHTML = linkify(data.content || rawText);
                document.getElementById('post-meta').textContent = data.date || "Feb. 15, 2026";

            } catch (err) {
                document.getElementById('post-title').textContent = "Notice";
                document.getElementById('post-content').textContent = "Check back later for updates";
                document.getElementById('post-meta').textContent = "System";
            }
        }

        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
