<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Info</title>

<style>
body{
  background:#0f0f0f;
  color:#00ff9c;
  font-family:monospace;
  padding:30px;
}

h1{
  font-size:40px;
}

p{
  color:white;
}
</style>
</head>

<body>

<h1>Hi Reap 👋</h1>

<div id="info"></div>

<script>
const info = document.getElementById("info");

function add(label,value){
  const p=document.createElement("p");
  p.innerHTML="<b>"+label+":</b> "+value;
  info.appendChild(p);
}

/* IP + location */
fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{
  add("IP",d.ip);
  add("City",d.city);
  add("Region",d.region);
  add("Country",d.country_name);
  add("ISP",d.org);
});

/* Browser info */
add("User Agent",navigator.userAgent);
add("Platform",navigator.platform);
add("Language",navigator.language);
add("Languages",navigator.languages);
add("Cookies Enabled",navigator.cookieEnabled);
add("Do Not Track",navigator.doNotTrack);
add("Online",navigator.onLine);

/* Screen */
add("Screen Resolution",screen.width+" x "+screen.height);
add("Color Depth",screen.colorDepth);

/* Hardware */
add("CPU Cores",navigator.hardwareConcurrency);
add("Device Memory (GB)",navigator.deviceMemory || "Unknown");

/* Timezone */
add("Timezone",Intl.DateTimeFormat().resolvedOptions().timeZone);

/* Network */
if(navigator.connection){
  add("Network Type",navigator.connection.effectiveType);
}

/* Battery */
if(navigator.getBattery){
navigator.getBattery().then(b=>{
  add("Battery Level",Math.round(b.level*100)+"%");
  add("Charging",b.charging);
});
}

/* GPS */
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
  add("Latitude",pos.coords.latitude);
  add("Longitude",pos.coords.longitude);
},()=>{
  add("GPS","Permission denied");
});
}

</script>

</body>
</html>
