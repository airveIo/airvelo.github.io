<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px;
            box-sizing: border-box;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0e0e0e; }

        ::-webkit-scrollbar-thumb { 
            background: #2a2a2a; 
            border-radius: 0; 
        }

        h1 {
            font-size: 48px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 18px;
            color: #888;
            margin: 10px 0 50px;
        }
        #feed {
            width: 100%;
            max-width: 650px;
        }
        .post {
            background: #161616;
            padding: 25px;
            border-radius: 0; 
            border-left: 3px solid #fff;
            margin-bottom: 25px;
        }
        .post h2 { margin: 0 0 10px; font-size: 22px; }
        .post p { color: #aaa; line-height: 1.6; margin: 0; white-space: pre-wrap; }
        .meta {
            font-size: 11px;
            color: #444;
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>Slurp</h1>
    <p class="subtitle">Updates and Announcements</p>
    <div id="feed"></div>
    <script>
        async function load() {
            try {
                const r = await fetch('news.html');
                const d = await r.json();
                document.getElementById('feed').innerHTML = d.map(p => `
                    <div class="post">
                        <h2>${p.title}</h2>
                        <p>${p.content}</p>
                        <div class="meta">${p.date}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('feed').innerHTML = "Check back later for updates.";
            }
        }
        load();
    </script>
</body>
</html>
