<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #121212;
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
            --accent: #ffffff;
            --border: #050505;
            --meta: #52525b;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 64px;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 12px;
        }

        #feed {
            width: 100%;
            max-width: 600px;
        }

        .post {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 32px;
            display: block;
        }

        .post h2 { 
            margin: 0 0 12px; 
            font-size: 1.5rem; 
            font-weight: 700;
        }

        .post p { 
            color: var(--text-dim); 
            font-size: 1.05rem;
            margin: 0; 
        }

        .post img, .post video {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0 0 0;
            display: block;
        }

        .post a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            font-weight: 500;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--meta);
            margin-top: 28px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .skeleton {
            background: var(--card-bg);
            border-radius: 20px;
            height: 160px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <header role="banner">
        <h1>SLURP</h1>
        <p class="subtitle">Updates and Announcements</p>
    </header>

    <main id="feed" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </main>

    <script>
        async function loadFeed() {
            const feed = document.getElementById('feed');
            try {
                const response = await fetch('test.html');
                if (!response.ok) throw new Error();
                const content = await response.text();
                
                setTimeout(() => {
                    feed.innerHTML = content;
                    const metaElements = feed.querySelectorAll('.meta');
                    
                    metaElements.forEach(meta => {
                        const timestamp = meta.getAttribute('data-timestamp');
                        if (timestamp) {
                            const [year, month, day] = timestamp.split('-').map(Number);
                            const date = new Date(year, month - 1, day);
                            
                            meta.textContent = date.toLocaleDateString(undefined, {
                                month: 'short',
                                day: 'numeric',
                                year: 'numeric'
                            });
                        }
                    });
                }, 400);
            } catch (err) {
                feed.innerHTML = `<p style="text-align: center; color: var(--meta);">Unable to load updates. Try refreshing.</p>`;
            }
        }
        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
