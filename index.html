<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slurp | Feed</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --border: #27272a;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { 
            background: #333; 
            border-radius: 10px;
            border: 2px solid var(--bg);
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        #feed {
            width: 100%;
            max-width: 600px;
        }

        .post {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .post:hover {
            transform: translateY(-2px);
            border-color: #3f3f46;
        }

        .post h2 { 
            margin: 0 0 12px; 
            font-size: 1.5rem; 
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .post p { 
            color: var(--text-dim); 
            font-size: 1rem;
            margin: 0; 
            white-space: pre-wrap; 
        }

        .meta {
            font-size: 0.8rem;
            color: #52525b;
            margin-top: 24px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .error-msg {
            color: var(--text-dim);
            text-align: center;
            padding: 40px;
            border: 1px dashed var(--border);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLURP</h1>
        <p class="subtitle">Updates and Announcements</p>
    </header>

    <main id="feed">
        <div class="error-msg">Loading updates...</div>
    </main>

    <script>
        async function loadFeed() {
            const feedContainer = document.getElementById('feed');
            try {
                const response = await fetch('news.html');
                if (!response.ok) throw new Error();
                const content = await response.text();
                feedContainer.innerHTML = content;
            } catch (err) {
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        <p>Check back later for updates.</p>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
