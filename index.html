<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Slurp</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #1a1d21; 
            color: #e1e1e1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .login-container {
            background: #24292e; 
            padding: 40px;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            border-radius: 0; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            pointer-events: none; 
        }

        .maintenance-notice {
            background-color: #383214;
            border: 1px solid #635219;
            color: #ffda6a;
            padding: 12px;
            font-size: 13px;
            margin-bottom: 25px;
            border-radius: 0; 
            line-height: 1.4;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
        }

        .description {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 30px;
            display: block;
            text-align: center;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .label-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start; 
            gap: 8px; 
            margin-bottom: 8px;
            color: #8b949e;
        }

        .label-icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            box-sizing: border-box;
            background-color: #0d1117;
            color: #c9d1d9;
            opacity: 0.5;
            text-align: center; 
            border-radius: 0; 
        }

        button {
            background-color: #484f58;
            color: #8b949e;
            border: none;
            padding: 12px 24px;
            font-weight: 600;
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
            cursor: not-allowed;
            border-radius: 0; 
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="login-container">
        <div class="maintenance-notice">
            <strong>System Maintenance</strong><br>
            Maintenance is in progress. We will be back soon.
        </div>

        <h2>Login</h2>
        <span class="description">Access your Slurp account</span>
        
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="user" class="label-icon"></i>
                <label>Username *</label>
            </div>
            <input type="text" disabled>
        </div>
        
        <div class="form-row">
            <div class="label-wrapper">
                <i data-lucide="lock" class="label-icon"></i>
                <label>Password *</label>
            </div>
            <input type="password" disabled>
        </div>
        
        <button disabled>Log in</button>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
                e.preventDefault();
            }
        });

        setInterval(() => {
            const before = new Date().getTime();
            debugger;
            const after = new Date().getTime();
            if (after - before > 100) {
                window.location.reload();
            }
        }, 100);
    </script>
</body>
</html>
