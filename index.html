<!DOCTYPE html>
<html>
<head>
<title>Your IP</title>
</head>
<body>

<h1>Your IP: <span id="ip">Loading...</span></h1>

<script>
fetch("https://api.ipify.org?format=json")
  .then(response => response.json())
  .then(data => {
    document.getElementById("ip").textContent = data.ip;
  });
</script>

</body>
</html>
